[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pdx-format"
version = "1.0.0"
description = "CLI formatter for Paradox Interactive script files"
requires-python = ">=3.10"

[project.scripts]
pdx-format = "pdx_format.cli:main"
pdx-brace = "pdx_format.cli:brace_main"

[tool.setuptools.packages.find]
include = ["pdx_format*", "pdx_utilities*"]
